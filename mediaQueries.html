<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .div1{
            padding: 10px;
            margin: 10px;
            width: 50px;
            height: 50px;
            animation: anim 2s ease-out 3;
            background-color: blue;
            /* transition: all; */
        }
        @media screen{
            body{
                background-color: red;
            }
        }
        @media screen and (max-width:400px) {
            body{
                background-color: green;
            }
        }
    </style>
</head>
<body>
    <h1>Media Queries</h1>
    <div class="div1"></div>
</body>
</html>
