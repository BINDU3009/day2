<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <img src="#" alt="logo">
        <h1 class="text-white">Election Management system</h1>
      </div>
    </nav>
    <nav class="navbar-secondary bg-secondary mb-3">
        <a class="text-dark" href="#">Home</a>
        <a class="text-dark ms-5" href="#">About us</a>
        <a class="text-dark ms-5" href="#">Contact us</a>
        <a class="text-dark ms-5" href="#">Login</a>
        <a class="text-dark ms-5" href="#">Registration form</a>
    </nav>
    <h2 class="mt-3 text-center text-muted">User Registration Page</h2>
    <div class="container mt-4">
    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input class="form-control" type="text">
    </div>
    <div class="mb-3">
        <label class="form-label">Flat/House Number</label>
        <input class="form-control" type="text">
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email">
    </div>
    <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <input class="form-control" type="phone">
    </div>
    <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password">
    </div>
    <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input class="form-control" type="password">
    </div>
   <div class="mb-3">
    <label class="form-label">Resident Type</label>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="resident" value="Owner">
        <label class="form-check-label">Owner</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="resident" value="Tenant">
        <label class="form-check-label">Tenant</label>
    </div>
    </div>
    <a href="Bdashboard.html" class="btn btn-primary mt-3">Register</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>
</html>
