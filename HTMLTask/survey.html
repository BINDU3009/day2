<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society survey and representation Election</title>
</head>
<body>
    <h1><center><b>Society survey page</b></center></h1>
    <form action="#">
        <h3><b>1.Cleanliness satisfaction</b></h3>
        <input type="radio" name="clean">
        <label for="clean">Excellent</label>
        <input type="radio" name="clean">
        <label for="clean">Good</label>
        <input type="radio" name="clean">
        <label for="clean">Neutral</label>
        <input type="radio" name="clean">
        <label for="clean">Bad</label>
        <input type="radio" name="clean">
        <label for="clean">Very Bad</label>
        <h3><b>Security service feedback</b></h3>
        <input type="checkbox" name="service">
        <label for="service">cc tv</label>
        <input type="checkbox" name="service">
        <label for="service">park</label>
        <input type="checkbox" name="service">
        <label for="service">home services</label>
        <input type="checkbox" name="service">
        <label for="service">maintanance</label>
        <input type="checkbox" name="service">
        <label for="service">security</label>
        <h3><b>Parking issues</b></h3>
         <select name="issues" id="issues">
            <option value="1 wheeler"> 1 wheeler</option>
            <option value="2 wheelers">2 wheelers</option>
            <option value="3 wheelers">3 wheelers</option>
            <option value="4 wheelers">4 wheelers</option>
         </select>
         <h3><b>water supply feedback</b></h3>
         <textarea name="water supply" id="water supply"></textarea>
         <h3><b>maintenance quality</b></h3>
         <input type="radio" name="qality">
         <label for="quality">very good</label>
         <input type="radio" name="qality">
         <label for="quality">good</label>
        <input type="radio" name="qality">
         <label for="quality">average</label>
         <input type="radio" name="qality">
         <label for="quality">bad</label>
         <input type="radio" name="qality">
         <label for="quality">very bad</label>
         <h3><b>Suggestion Box</b></h3>
         <textarea name="box" id="box"></textarea>
         <br><br>
         <button type="submit"> submit</button>
    </form>
</body>
</html>
