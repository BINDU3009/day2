<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-box{
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.2);

        .portal-title{
            text-align: center;
            margin-bottom: 25px;
            color: #0d6efd;
            font-weight: bold;
        }

        .btn-login{

        }

        .error{
            color: red;
            font-size: 14px;
        }

</head>

<body>

    <div class="login-box">

        <h2 class="portal-title">Student Management Portal</h2>

        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">Username</label>

                <input 
                    type="name"

            </div>

            <div class="mb-3">

                <label class="form-label">Password</label>

                <input 
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password">

                <div id="passwordError" class="error"></div>

            </div>

                Login
            </button>

        </form>
