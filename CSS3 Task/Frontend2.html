<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">Student Registration Form</h3>
        <form action="#" class="needs-validation" id="registerForm">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" 
                       placeholder="Enter full name"
                       minlength="3" maxlength="30"
                       pattern="[A-Za-z ]{3,30}"
                       title="Only letters allowed (3-30 characters)"
                       required id="name">
            </div>
            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" class="form-control"
                       pattern="[0-9A-Za-z]{5,15}"
                       title="Alphanumeric roll number (5-15 chars)"
                       required id="roll">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control"
                       placeholder="example@gmail.com"
                       required id="email">
            </div>
            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control"
                       pattern="[6-9]{1}[0-9]{9}"
                       maxlength="10"
                       placeholder="10-digit mobile number"
                       title="Enter valid 10-digit Indian number"
                       required id="mobile">
            </div>
            <div class="mb-3">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="male" required>
                    <label class="form-check-label">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="female">
                    <label class="form-check-label">Female</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" value="others">
                    <label class="form-check-label">Others</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Branch</label>
                <select class="form-select" required id="branch">
                    <option value="">Select Branch</option>
                    <option>CSE</option>
                    <option>CSC</option>
                    <option>CSD</option>
                    <option>CSBS</option>
                    <option>AIML</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>CIVIL</option>
                    <option>MECH</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" required id="dob">
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="3" minlength="10" required id="add"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Upload Photo</label>
                <input type="file" class="form-control" accept="image/*" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terms" required style="transform: scale(0.9);">
                <label class="form-check-label small" for="terms">
                    I agree to Terms & Conditions
                </label>
            </div>
            <button type="submit" class="btn btn-primary w-100">
    Register
</button>
        </form>
    </div>
</div>
<script>
document.getElementById("registerForm").addEventListener("submit", function(e){

    e.preventDefault();

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let email = document.getElementById("email").value;
    let mobile = document.getElementById("mobile").value;
    let dob = document.getElementById("dob").value;
    let address = document.getElementById("add").value;
    let branch = document.getElementById("branch").value;

    let gender =
    document.querySelector('input[name="gender"]:checked').value;

    sessionStorage.setItem("name", name);
    sessionStorage.setItem("roll", roll);
    sessionStorage.setItem("email", email);
    sessionStorage.setItem("mobile", mobile);
    sessionStorage.setItem("gender", gender);
    sessionStorage.setItem("branch", branch);
    sessionStorage.setItem("dob", dob);
    sessionStorage.setItem("address", address);

    alert("Registration Successful");

    window.location.href = "Frontend3.html";
});</script>
</body>
</html>
