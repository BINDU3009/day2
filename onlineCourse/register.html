<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f8f9fa;
}
.form-container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="index.html">Tech Academy</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
<li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
<li class="nav-item"><a class="nav-link" href="aboutus.html">About</a></li>
<li class="nav-item"><a class="nav-link" href="contactus.html">Contact</a></li>
</ul>
</div>
</div>
</nav>

<div class="container my-5">

<div class="form-container">

<h2 class="text-center mb-4">
Student Registration Form
</h2>

<form class="needs-validation" novalidate>

<div class="mb-3">
<label class="form-label">Student Name</label>
<input type="text" class="form-control" required>
<div class="invalid-feedback">
Please enter your name.
</div>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" required>
<div class="invalid-feedback">
Enter a valid email.
</div>
</div>

<div class="mb-3">
<label class="form-label">Mobile Number</label>
<input type="tel" class="form-control" pattern="[0-9]{10}" required>
<div class="invalid-feedback">
Enter a valid 10-digit mobile number.
</div>
</div>

<div class="mb-3">
<label class="form-label">Gender</label>

<div class="form-check">
<input class="form-check-input" type="radio" name="gender" required>
<label class="form-check-label">Male</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="gender">
<label class="form-check-label">Female</label>
</div>

</div>

<div class="mb-3">
<label class="form-label">Select Course</label>

<select class="form-select" required>
<option value="">Choose Course</option>
<option>Web Development</option>
<option>Python Programming</option>
<option>Data Science</option>
<option>AI & Machine Learning</option>
<option>Java Programming</option>
<option>Cloud Computing</option>
</select>

<div class="invalid-feedback">
Select a course.
</div>
</div>

<div class="mb-3">
<label class="form-label">Qualification</label>

<select class="form-select" required>
<option value="">Select Qualification</option>
<option>Intermediate</option>
<option>Diploma</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>M.Tech</option>
<option>MCA</option>
</select>

</div>

<div class="mb-3">
<label class="form-label">Address</label>

<textarea class="form-control" rows="4" required></textarea>

</div>

<div class="mb-3">
<label class="form-label">Upload Resume</label>

<input type="file" class="form-control" required>

</div>

<div class="form-check mb-3">
<input type="checkbox" class="form-check-input" required>

<label class="form-check-label">
I agree to the Terms & Conditions
</label>

</div>

<button type="submit" class="btn btn-success w-100">
Register Now
</button>

</form>

</div>
</div>


<footer class="bg-dark text-white text-center p-3">
<p>© 2025 Tech Academy | All Rights Reserved</p>
</footer>

<script>
(() => {
'use strict'

const forms = document.querySelectorAll('.needs-validation')

Array.from(forms).forEach(form => {
form.addEventListener('submit', event => {

if (!form.checkValidity()) {
event.preventDefault()
event.stopPropagation()
}
else{
alert("Registration Successful!");
}

form.classList.add('was-validated')
}, false)
})
})()
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
